<VirtualHost *:8011>
    ServerName clientes.nimbus-docs.lab
    DocumentRoot /var/www/clientes

    <Directory /var/www/clientes>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cliente_error.log
    CustomLog ${APACHE_LOG_DIR}/cliente_access.log combined
</VirtualHost>