<VirtualHost *:8011>
    ServerName empre-nimbus.com
    DocumentRoot /var/www/privado

    <Directory /var/www/privado>
        Options -Indexes +FollowSymLinks 
        AllowOverride None
        Require all granted
    </Directory>
    
    <Files "nimbus3000.json">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/privado_error.log
    CustomLog ${APACHE_LOG_DIR}/privado_access.log combined
</VirtualHost>