
limit_req_zone $binary_remote_addr zone=perfil_nimbus:10m rate=3r/s;

server {
    listen 80; #captura todo el trafico que entra por el puerto estandar
    server_name clientes-nimbus.com empre-nimbus.com;
    return 301 https://$host$request_uri; #forzamos https
}

server {
    listen 443 ssl;
    server_name clientes-nimbus.com empre-nimbus.com;

    ssl_certificate /etc/nginx/certs/ec-cert.pem;
    ssl_certificate_key /etc/nginx/certs/ec-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;
    ssl_prefer_server_ciphers on;


    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
    location / {

        limit_req zone=perfil_nimbus burst=3 nodelay;

        proxy_pass http://apache-mapache:80;
        proxy_set_header Host $host;
       
    }
}